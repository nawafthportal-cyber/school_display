{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}المصادقة الثنائية{% endblock %} — لوحة العرض الذكية</title>
  <link rel="icon" type="image/png" sizes="1024x1024" href="/favicon.png?v=20260723-logo1">
  <link rel="apple-touch-icon" href="/favicon.png?v=20260723-logo1">
  <link rel="stylesheet" href="{% static 'css/tailwind.generated.css' %}?v=2026-04-15b">
  <link rel="stylesheet" href="{% static 'css/mobile.css' %}?v=2026-08-05-m1">
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard-auth.css' %}?v=2026-11-26-manager">
</head>
<body class="school-auth school-auth--security min-h-screen text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl items-center justify-center px-4 py-10">
    <section class="security-card w-full rounded-3xl border border-slate-700 p-5 shadow-2xl md:p-9" aria-labelledby="security-title">
      <div class="mb-7 flex items-center gap-4">
        <div class="security-mark flex h-12 w-12 items-center justify-center rounded-xl" aria-hidden="true">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-3 7-10V5l-7-3-7 3v7c0 7 7 10 7 10Z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div>
          <p class="security-kicker">أمان الحساب</p>
          <h1 id="security-title" class="mt-1 text-2xl font-black">{% block heading %}المصادقة الثنائية{% endblock %}</h1>
        </div>
      </div>

      {% if messages %}
        <div class="mb-5 space-y-2">
          {% for message in messages %}
            <div class="rounded-xl border px-4 py-3 text-sm {% if 'error' in message.tags %}border-rose-500/30 bg-rose-500/10 text-rose-100{% else %}border-teal-400/30 bg-teal-400/10 text-teal-100{% endif %}" {% if 'error' in message.tags %}role="alert"{% else %}role="status"{% endif %}>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
