<div class="dp-field">
  <label for="{{ strategy_id }}">طريقة تطبيق الجدول</label>
  <select id="{{ strategy_id }}" name="strategy" data-import-strategy aria-describedby="{{ strategy_id }}-help">
    <option value="merge"{% if selected_strategy != 'replace' %} selected{% endif %}>دمج التعديلات مع الجدول الحالي</option>
    <option value="replace"{% if selected_strategy == 'replace' %} selected{% endif %}>استبدال الجدول كاملًا</option>
  </select>
  <p id="{{ strategy_id }}-help" class="di-help"><strong>الدمج</strong> يحدّث الحصص الموجودة في الملف ويحتفظ ببقية الجدول. <strong>الاستبدال</strong> يطابق جدول المدرسة كاملًا مع الملف ويحذف الحصص الغائبة عنه. راجع قائمة الحذف قبل الاعتماد.</p>
</div>
