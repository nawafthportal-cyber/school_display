name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: config.settings
      TWO_FACTOR_ENCRYPTION_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install browser for display and dashboard regression tests
        run: python -m playwright install --with-deps chromium

      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

      - name: Static correctness checks
        run: ruff check .

      - name: Django deployment and migration checks
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-long-production-check-secret
          ALLOWED_HOSTS: school-display.com
          CSRF_TRUSTED_ORIGINS: https://school-display.com
          DATABASE_URL: sqlite:///db.sqlite3
          REDIS_CACHE_URL: redis://localhost:6379/0
          CACHE_REDIS_URL: redis://localhost:6379/0
          REDIS_CHANNELS_URL: redis://localhost:6379/1
          CHANNELS_REDIS_URL: redis://localhost:6379/1
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.resend.com
          EMAIL_HOST_USER: resend
          EMAIL_HOST_PASSWORD: ci-only-email-password
          DEFAULT_FROM_EMAIL: لوحة العرض الذكية <no-reply@mail.school-display.com>
          RESEND_API_KEY: ci-only-resend-api-key
          RESEND_WEBHOOK_SECRET: whsec_ci_only
          RESEND_INBOUND_ENABLED: "True"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run

      - name: Test with coverage
        env:
          DEBUG: "True"
        run: |
          coverage run manage.py test
          coverage report

      - name: Validate JavaScript syntax
        run: |
          for file in static/js/*.js; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Verify the minified display bundle is current
        run: |
          # package-lock.json is not tracked, so plain install is the only option.
          npm install --no-audit --no-fund
          npm run build:display
          git diff --exit-code -- static/js/display.min.js \
            || (echo "static/js/display.min.js is stale. Run: npm run build:display" && exit 1)

      - name: Verify the generated display assets are current
        env:
          DEBUG: "True"
        run: |
          # The legacy stylesheet is derived from display-board.css, and the
          # self-hosted font faces are referenced by fonts.css. Both go stale
          # silently — an old TV just renders wrong, nothing errors.
          python manage.py build_legacy_css --check
          python manage.py sync_display_font --check

      - name: Build production image
        run: docker build --tag school-display:ci .

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: admin_concurrency
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-isolated-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d admin_concurrency"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: isolated-postgres-test-secret
      TWO_FACTOR_ENCRYPTION_KEY: ""
      DATABASE_URL: postgres://ci:ci-isolated-test-password@localhost:5432/admin_concurrency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate concurrent owner and payment transitions on PostgreSQL
        run: python manage.py test dashboard.test_admin_concurrency --noinput
